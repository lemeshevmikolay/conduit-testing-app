name: Publish Docker Hub images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/conduit-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/conduit-app:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./db-snapshot
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/conduit-db-snapshot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/conduit-db-snapshot:${{ github.sha }}
      - name: Publish Compose stack artifact
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker compose -f docker-compose.remote.yml publish --yes "${DOCKERHUB_USERNAME}/conduit-stack:latest"
