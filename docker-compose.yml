services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: conduit-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - conduit_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: conduit-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
  db:
    image: mysql:8.4
    container_name: conduit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-conduit_local_dev}
      MYSQL_DATABASE: ${DEV_DB_NAME:-conduit_development}
      MYSQL_USER: ${DEV_DB_USERNAME:-conduit}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD:-conduit_local_dev}
    ports:
      - "${DEV_DB_PORT:-3306}:3306"
    volumes:
      - conduit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-conduit_local_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  conduit_mysql_data:
  conduit_elasticsearch_data:
